services:
  model_api:
    build: .
    container_name: model_api
    command: >
      gunicorn main:app
      -w 1
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8003
      --timeout 600
    ports:
      - "8003:8003"
    env_file:
      - ./.env
    environment:
      TMPDIR: /tmp/embedding-vector
    tmpfs:
      - /tmp/embedding-vector:rw,nosuid,nodev,noexec,size=2g
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
